[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiplexed-ism"
version = "0.1.0"
description = "GPU-first multiplexed in silico mutagenesis for PyTorch genomic models"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ken Chen", email = "chenkenbio@gmail.com" },
]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
progress = ["tqdm"]
dev = [
    "pytest>=7.0",
    "tqdm",
]

[tool.hatch.build.targets.wheel]
packages = ["multiplexed_ism"]
